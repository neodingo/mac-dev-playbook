---
# Personal configuration for M4 Air
# This file overrides default.config.yml

# =============================================================================
# DOTFILES
# =============================================================================
# The geerlingguy.dotfiles role is disabled since we don't have a remote repo yet.
# Instead, tasks/custom/dotfiles-init.yml creates a local dotfiles repo with
# starter files at ~/Development/dotfiles.
#
# After running the playbook, push to GitHub with:
#   cd ~/Development/dotfiles && gh repo create dotfiles --private --source=. --push
#
# Then enable the dotfiles role by uncommenting below:
configure_dotfiles: false
# dotfiles_repo: https://github.com/YOUR_USERNAME/dotfiles.git
# dotfiles_repo_local_destination: ~/Development/dotfiles
# dotfiles_repo_version: main
# dotfiles_files:
#   - .zshrc
#   - .gitconfig
#   - .vimrc

# =============================================================================
# FEATURE TOGGLES
# =============================================================================
configure_terminal: false
configure_osx: false
configure_dock: true
configure_sudoers: false
configure_sublime: false

# =============================================================================
# HOMEBREW CLI PACKAGES
# =============================================================================
homebrew_installed_packages:
  # Version control
  - git
  - gh          # GitHub CLI
  - glab        # GitLab CLI

  # Languages & runtimes
  - node
  - python
  - go
  - rust

  # DevOps & Cloud
  - docker-compose
  - terraform

  # Database clients
  - postgresql
  - mysql

  # Utilities
  - jq          # JSON processor
  - tmux        # Terminal multiplexer
  - pandoc      # Document converter
  - btop        # Resource monitor
  - htop        # Process viewer
  - tree        # Directory tree viewer
  - mc          # Midnight Commander file manager
  - uv          # Fast Python package manager

  # .NET
  - dotnet

  # Keep useful defaults
  - wget
  - openssl
  - readline

# =============================================================================
# HOMEBREW CASK APPS (GUI)
# =============================================================================
homebrew_cask_apps:
  # Development
  - visual-studio-code
  - iterm2
  - docker

  # Browser
  - google-chrome

  # Communication
  - discord

  # Media
  - spotify
  - iina        # Modern video player

  # AI/ML
  - lm-studio   # Local LLM runner

# =============================================================================
# MAC APP STORE APPS
# =============================================================================
# Requires being signed in to the App Store
# Find IDs at: https://apps.apple.com (ID is in the URL)
mas_installed_apps:
  - {id: 497799835, name: "Xcode"}
  - {id: 1475387142, name: "Tailscale"}
  - {id: 6444050820, name: "Draw Things"}
  - {id: 1136220934, name: "Infuse"}

# Note: PS Remote Play is installed via tasks/custom/ps-remote-play.yml

# =============================================================================
# DOCK CONFIGURATION
# =============================================================================
dockitems_remove:
  - Launchpad
  - TV
  - Podcasts
  - News
  - Keynote
  - Numbers
  - Pages
  - Maps
  - FaceTime
  - Freeform
  - Apps
  - Messages
  - Photos
  - Phone
  - Contacts
  - Music
  - Games
  - App Store
  - iPhone Mirroring

dockitems_persist:
  - name: "Safari"
    path: "/Applications/Safari.app/"
    pos: 1
  - name: "Google Chrome"
    path: "/Applications/Google Chrome.app/"
    pos: 2
  - name: "Discord"
    path: "/Applications/Discord.app/"
    pos: 3
  - name: "Mail"
    path: "/Applications/Mail.app/"
    pos: 4
  - name: "Calendar"
    path: "/Applications/Calendar.app/"
    pos: 5
  - name: "iTerm"
    path: "/Applications/iTerm.app/"
    pos: 6
  - name: "Visual Studio Code"
    path: "/Applications/Visual Studio Code.app/"
    pos: 7
  - name: "Spotify"
    path: "/Applications/Spotify.app/"
    pos: 8
  - name: "PS Remote Play"
    path: "/Applications/PS Remote Play.app/"
    pos: 9

# =============================================================================
# EXTRA PACKAGES
# =============================================================================
npm_packages:
  - name: typescript

pip_packages:
  - name: pydantic

gem_packages: []

composer_packages: []

# =============================================================================
# POST-PROVISION TASKS
# =============================================================================
post_provision_tasks:
  - "{{ playbook_dir }}/tasks/custom/*.yml"
