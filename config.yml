---
# Personal configuration for M4 Air
# This file overrides default.config.yml

# =============================================================================
# DOTFILES
# =============================================================================
configure_dotfiles: true
dotfiles_repo: git@github.com:neodingo/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Development/ops/dotfiles
dotfiles_repo_version: master
dotfiles_files:
  # Shell
  - .zshrc
  - .inputrc
  # Git
  - .gitconfig
  - .gitignore_global
  # Editors
  - .vimrc
  # Tools
  - .tmux.conf
  - .npmrc
  - .psqlrc
  - .terraformrc
  # App configs
  - .claude/settings.json
  - .config/gh/config.yml
  # macOS preferences
  - .osx

# =============================================================================
# FEATURE TOGGLES
# =============================================================================
configure_terminal: false
configure_osx: true
configure_dock: true
configure_sudoers: false
configure_sublime: false

# =============================================================================
# HOMEBREW CLI PACKAGES
# =============================================================================
homebrew_installed_packages:
  # Version control
  - git
  - gh          # GitHub CLI
  - glab        # GitLab CLI

  # Languages & runtimes
  - node
  - python
  - go
  - rust

  # DevOps & Cloud
  - docker-compose
  - terraform

  # Database clients
  - postgresql
  - mysql

  # AI/ML
  - gemini-cli  # Google Gemini CLI
  - ollama

  # Utilities
  - jq          # JSON processor
  - tmux        # Terminal multiplexer
  - pandoc      # Document converter
  - btop        # Resource monitor
  - htop        # Process viewer
  - tree        # Directory tree viewer
  - mc          # Midnight Commander file manager
  - uv          # Fast Python package manager
  - dockutil    # Dock management
  - mactop      # Apple Silicon monitor
  - openai-whisper # Local Whisper CLI

  # Clawdbot AI agent dependencies
  - ffmpeg
  - memo
  - remindctl
  - peekaboo
  - summarize
  - mas         # Mac App Store CLI

  # .NET
  - dotnet

  # Keep useful defaults
  - wget
  - openssl
  - readline

# =============================================================================
# HOMEBREW TAPS
# =============================================================================
homebrew_taps:
  - antoniorodr/memo
  - steipete/tap

# =============================================================================
# HOMEBREW CASK APPS (GUI)
# =============================================================================
homebrew_cask_apps:
  # Development
  - visual-studio-code
  - iterm2
  - docker

  # Browser
  - google-chrome

  # Communication
  - discord

  # Media
  - spotify
  - iina        # Modern video player

  # Gaming
  - steam

  # AI/ML
  - claude      # Claude desktop app
  - lm-studio   # Local LLM runner
  - openclaw    # OpenClaw Mac Menu Bar App

  # GUI apps
  - ollama-app  # Ollama desktop app

# =============================================================================
# VS CODE EXTENSIONS
# =============================================================================
vscode_extensions:
  - saoudrizwan.claude-dev
  - ms-python.python
  - ms-azuretools.vscode-docker
  - github.copilot
  - esbenp.prettier-vscode
  - redhat.vscode-yaml
  - tailscale.vscode-tailscale

# =============================================================================
# MAC APP STORE APPS
# =============================================================================
# Requires being signed in to the App Store
# Find IDs at: https://apps.apple.com (ID is in the URL)
mas_installed_apps:
  - {id: 497799835, name: "Xcode"}
  - {id: 1475387142, name: "Tailscale"}
  - {id: 6444050820, name: "Draw Things"}
  - {id: 1136220934, name: "Infuse"}
  # Note: Govee Lite and eufy are iOS apps (not native macOS) - install manually from App Store

# Note: PS Remote Play is installed via tasks/custom/ps-remote-play.yml

# =============================================================================
# DOCK CONFIGURATION
# =============================================================================
dockitems_remove:
  - Launchpad
  - TV
  - Podcasts
  - News
  - Keynote
  - Numbers
  - Pages
  - Maps
  - FaceTime
  - Freeform
  - Apps
  - Messages
  - Photos
  - Phone
  - Contacts
  - Music
  - Games
  - App Store
  - iPhone Mirroring

dockitems_persist:
  - name: "Safari"
    path: "/Applications/Safari.app/"
    pos: 1
  - name: "Discord"
    path: "/Applications/Discord.app/"
    pos: 2
  - name: "Mail"
    path: "/Applications/Mail.app/"
    pos: 3
  - name: "Calendar"
    path: "/Applications/Calendar.app/"
    pos: 4
  - name: "iTerm"
    path: "/Applications/iTerm.app/"
    pos: 5
  - name: "Visual Studio Code"
    path: "/Applications/Visual Studio Code.app/"
    pos: 6
  - name: "Spotify"
    path: "/Applications/Spotify.app/"
    pos: 7
  - name: "PS Remote Play"
    path: "/Applications/RemotePlay.app/"
    pos: 8

# =============================================================================
# EXTRA PACKAGES
# =============================================================================
npm_packages:
  - name: typescript

pip_packages:
  - name: pydantic

gem_packages: []

composer_packages: []

# =============================================================================
# POST-PROVISION TASKS
# =============================================================================
post_provision_tasks:
  - "{{ playbook_dir }}/tasks/custom/*.yml"
