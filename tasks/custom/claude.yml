---
# Claude Code config. ~/.claude/settings.json is generated (Claude Code rewrites it in
# place, so it must not be a dotfiles symlink). See ~/.dotfiles/claude/README.md.
- name: Clone the personal Claude plugin marketplace into the iCloud Development tree.
  ansible.builtin.git:
    repo: git@github.com:neodingo/claude-plugins.git
    dest: "{{ ansible_facts.user_dir }}/iCloud/Development/projects/claude-plugins"
    update: false
    accept_hostkey: true
  tags: ['claude']

- name: Render ~/.claude/settings.json from the dotfiles base and host overlay.
  ansible.builtin.command: "{{ ansible_facts.user_dir }}/.dotfiles/claude/claude-config render"
  register: claude_render
  changed_when: "'rendered' in claude_render.stdout"
  tags: ['claude']

- name: Link Claude mods and launchers.
  ansible.builtin.command: "{{ ansible_facts.user_dir }}/.dotfiles/claude/claude-config link"
  register: claude_link
  changed_when: false
  tags: ['claude']
