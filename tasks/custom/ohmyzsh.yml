---
- name: Check if Oh My Zsh is already installed.
  stat:
    path: ~/.oh-my-zsh
  register: ohmyzsh_dir

- name: Download Oh My Zsh install script.
  get_url:
    url: https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh
    dest: /tmp/ohmyzsh-install.sh
    mode: "0755"
  when: not ohmyzsh_dir.stat.exists

- name: Install Oh My Zsh.  # noqa: command-instead-of-module
  # Using command because there's no ansible module for Oh My Zsh
  command: /tmp/ohmyzsh-install.sh --unattended
  args:
    creates: ~/.oh-my-zsh
  environment:
    RUNZSH: "no"
    CHSH: "no"
  when: not ohmyzsh_dir.stat.exists

- name: Clean up Oh My Zsh install script.
  file:
    path: /tmp/ohmyzsh-install.sh
    state: absent

- name: Display Oh My Zsh installation status.
  debug:
    msg: >-
      Oh My Zsh installed at ~/.oh-my-zsh.
      Restart your terminal or run 'source ~/.zshrc' to activate.
  when: not ohmyzsh_dir.stat.exists
